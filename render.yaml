databases:
  - name: sv-db
    databaseName: sv_database
    user: sv_user
    plan: free

services:
  # Python Backend API
  - type: web
    name: sv-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sv-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CORS_ORIGINS
        value: "*"

  # React Frontend (Static Site)
  - type: web
    name: sv-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: "./dist"
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: sv-backend
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
